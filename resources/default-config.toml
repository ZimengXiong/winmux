config-version = 2

start-at-login = false
auto-reload-config = true
enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true
tab-group-padding = 30

window-tabs.enabled = true
window-tabs.height = 36

default-root-container-layout = 'tiles'
default-root-container-orientation = 'auto'

on-focused-monitor-changed = ['move-mouse monitor-lazy-center']

automatically-unhide-macos-hidden-apps = false
automatically-tile-new-windows = true
# Shake a window horizontally while dragging its title bar to toggle floating/tiling.
enable-shake-to-toggle-tiling = true
auto-add-new-windows-to-tab-group = true
shortcuts-preset = 'none'
persistent-workspaces = []
on-mode-changed = []

[key-mapping]
    preset = 'qwerty'

[gaps]
    # Space between tiled windows. Set either value to 0 for borderless joins.
    inner.horizontal = 8
    inner.vertical = 8
    # With the sidebar enabled, outer.left is the space between it and tiled windows.
    # Set all outer values to 0 for borderless display edges/sidebar joins.
    outer.left = 12
    outer.bottom = 12
    outer.top = 12
    outer.right = 12

[workspace-sidebar]
    enabled = true
    # Keep the sidebar above system UI such as the Dock. Set false to keep it
    # above ordinary app windows while allowing the Dock to appear over it.
    stay-on-top = true
    # Hide the compact rail until the pointer reaches the display's left edge.
    auto-hide = false
    # Keep the full sidebar open and reserve its width for tiled windows.
    always-expanded = false
    collapsed-width = 50
    width = 280
    # Omit monitor to show an independent sidebar on every display.
    # Legacy monitor = 'main' is also treated as all displays for this sidebar.
    # Use monitor = 1, 'secondary', 2, or a list to restrict it.
    menu-bar-reserve-height = 28
    project-deletion-action = 'close-windows'
    show-status-pills = true
    show-clock = false
    show-seconds = true
    show-date = false
    show-weekday = true
    # Apply this style to sidebar, tab groups, and switcher chrome. Use 'solid' for opaque color.
    chrome-style = 'liquid-glass'
    # Used when chrome-style = 'solid'. Choose from the Appearance palette, or use 'custom'.
    solid-chrome-color = 'midnight'
    # Used when solid-chrome-color = 'custom'.
    solid-chrome-custom-color = '#191B20'

[workspace-sidebar.project-labels]
    "default" = "Default"

[workspace-sidebar.project-colors]
    "default" = "#C4B5FD"

[mode.main.binding]
    ctrl-f = 'open-sidebar'
    alt-space = 'layout horizontal vertical'
    alt-h = 'focus left'
    alt-j = 'focus down'
    alt-k = 'focus up'
    alt-l = 'focus right'
    alt-n = 'focus dfs-next'
    alt-p = 'focus dfs-prev'
    alt-tab = 'focus tab-next'
    alt-shift-tab = 'focus tab-prev'
    alt-0 = 'focus --tab-index 10'
    alt-1 = 'focus --tab-index 1'
    alt-2 = 'focus --tab-index 2'
    alt-3 = 'focus --tab-index 3'
    alt-4 = 'focus --tab-index 4'
    alt-5 = 'focus --tab-index 5'
    alt-6 = 'focus --tab-index 6'
    alt-7 = 'focus --tab-index 7'
    alt-8 = 'focus --tab-index 8'
    alt-9 = 'focus --tab-index 9'
    alt-shift-h = 'move left'
    alt-shift-j = 'move down'
    alt-shift-k = 'move up'
    alt-shift-l = 'move right'
    alt-shift-t = 'layout floating tiling'
    alt-shift-m = 'fullscreen'
    cmd-shift-h = 'join-with left'
    cmd-shift-j = 'join-with down'
    cmd-shift-k = 'join-with up'
    cmd-shift-l = 'join-with right'
    ctrl-cmd-shift-h = 'stack-with left'
    ctrl-cmd-shift-j = 'stack-with down'
    ctrl-cmd-shift-k = 'stack-with up'
    ctrl-cmd-shift-l = 'stack-with right'
    cmd-shift-i = 'balance-sizes'
    alt-cmd-h = 'project prev'
    alt-cmd-j = 'swap down'
    alt-cmd-k = 'swap up'
    alt-cmd-l = 'project next'
    alt-cmd-1 = 'project 1'
    alt-cmd-2 = 'project 2'
    alt-cmd-3 = 'project 3'
    alt-cmd-4 = 'project 4'
    alt-cmd-5 = 'project 5'
    alt-cmd-6 = 'project 6'
    alt-cmd-7 = 'project 7'
    alt-cmd-8 = 'project 8'
    alt-cmd-9 = 'project 9'
    ctrl-0 = 'workspace 10'
    ctrl-1 = 'workspace 1'
    ctrl-2 = 'workspace 2'
    ctrl-3 = 'workspace 3'
    ctrl-4 = 'workspace 4'
    ctrl-5 = 'workspace 5'
    ctrl-6 = 'workspace 6'
    ctrl-7 = 'workspace 7'
    ctrl-8 = 'workspace 8'
    ctrl-9 = 'workspace 9'
    ctrl-q = 'workspace 11'
    ctrl-w = 'workspace 12'
    ctrl-e = 'workspace 13'
    ctrl-r = 'workspace 14'
    ctrl-t = 'workspace 15'
    ctrl-h = 'workspace prev'
    ctrl-l = 'workspace next'
    cmd-ctrl-h = 'workspace prev'
    cmd-ctrl-l = 'workspace next'
    alt-shift-1 = 'move-node-to-workspace 1'
    alt-shift-2 = 'move-node-to-workspace 2'
    alt-shift-3 = 'move-node-to-workspace 3'
    alt-shift-4 = 'move-node-to-workspace 4'
    alt-shift-5 = 'move-node-to-workspace 5'
    alt-shift-6 = 'move-node-to-workspace 6'
    alt-shift-7 = 'move-node-to-workspace 7'
    alt-shift-8 = 'move-node-to-workspace 8'
    alt-shift-9 = 'move-node-to-workspace 9'
    ctrl-shift-0 = 'move-node-to-workspace 10'
    ctrl-shift-h = 'move-node-to-workspace --focus-follows-window prev'
    ctrl-shift-l = 'move-node-to-workspace --focus-follows-window next'
    alt-cmd-shift-h = 'move-node-to-project prev'
    alt-cmd-shift-l = 'move-node-to-project next'
    alt-cmd-shift-1 = 'move-node-to-project 1'
    alt-cmd-shift-2 = 'move-node-to-project 2'
    alt-cmd-shift-3 = 'move-node-to-project 3'
    alt-cmd-shift-4 = 'move-node-to-project 4'
    alt-cmd-shift-5 = 'move-node-to-project 5'
    alt-cmd-shift-6 = 'move-node-to-project 6'
    alt-cmd-shift-7 = 'move-node-to-project 7'
    alt-cmd-shift-8 = 'move-node-to-project 8'
    alt-cmd-shift-9 = 'move-node-to-project 9'
